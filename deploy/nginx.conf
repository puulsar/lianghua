server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 前端 axios 的 baseURL 是 /api，这里把 /api/ 前缀剥掉再转发给后端
    # /api/stockIndex/cards -> http://backend:8084/stockIndex/cards
    # 注意：nginx 启动时解析 backend 的 IP。若单独重建过 backend 容器导致 IP 变化，
    #       重启一次 web 容器即可（docker compose restart web）。
    location /api/ {
        proxy_pass http://backend:8084/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router 是 history 模式，需要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
