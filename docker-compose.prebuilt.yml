# ============================================================
#  AQuant —— 零构建版 Docker Compose
#  适用：NAS / 服务器网络不佳，或不想在上面跑 Maven / npm 构建
#  特点：全部用官方现成镜像，不执行任何 docker build
#        - backend : eclipse-temurin:17-jre  + 挂载 prebuilt/*.jar
#        - web     : nginx:alpine            + 挂载 prebuilt/dist
#        - mysql   : mysql:8.4（自动导入 stock.sql）
#        - aktools : python:3.12-slim        + 首次启动时 pip 安装
#  依赖：prebuilt/a-quant-0.0.1-SNAPSHOT.jar 与 prebuilt/dist/ 已就位
#  启动：docker compose -f docker-compose.prebuilt.yml up -d
# ============================================================
name: aquant

services:

  mysql:
    image: mysql:8.4
    container_name: aquant-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aquant_root_change_me}
      MYSQL_DATABASE: stock
      MYSQL_USER: test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testtest}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_ROOT:-./.runtime/docker}/mysql:/var/lib/mysql
      # stock.sql 只在数据目录为空时（首次初始化）执行一次
      - ./stock.sql:/docker-entrypoint-initdb.d/01-stock.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [aquant]

  aktools:
    image: python:3.12-slim
    container_name: aquant-aktools
    restart: unless-stopped
    # 不预构建镜像：首次启动时装依赖（走阿里云 PyPI 源，约 2-5 分钟），装完才起服务
    # --host 0.0.0.0 是必须的：上游默认 127.0.0.1，容器里会导致 backend 连不上
    command: >
      sh -c "pip install --no-cache-dir -i https://mirrors.aliyun.com/pypi/simple/
             'aktools==0.0.91' akshare &&
             python -m aktools --host 0.0.0.0 --port 8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/docs',timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 360s
    networks: [aquant]

  backend:
    image: eclipse-temurin:17-jre
    container_name: aquant-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      aktools:
        condition: service_healthy
    entrypoint: ["sh", "-c", "exec java $JAVA_OPTS -jar /app/app.jar"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stock?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-testtest}
      AKSHARE_ADDRESS: http://aktools:8080
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-your-email@qq.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-your-smtp-auth-code}
    volumes:
      - ./prebuilt/a-quant-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "${BACKEND_PORT:-8084}:8084"
    networks: [aquant]

  web:
    image: nginx:alpine
    container_name: aquant-web
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - ./prebuilt/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8081}:80"
    networks: [aquant]

networks:
  aquant:
    driver: bridge
